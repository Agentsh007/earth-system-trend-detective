[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "earth-system-trend-detective"
version = "1.0.0"
description = "Offline-first Earth-system trend investigation tool for Bangladesh"
authors = [{ name = "Earth System Trend Detective Team" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pyarrow>=15.0.0",
    "zarr>=2.17.0",
    "xarray>=2024.2.0",
    "pydantic>=2.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

